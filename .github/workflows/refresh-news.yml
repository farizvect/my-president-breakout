name: Refresh news snapshot

on:
  workflow_dispatch:
  schedule:
    # Every hour, every day (including weekends). News does not need IDX hours.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: news-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: Fetch Google News RSS feeds
        run: node scripts/fetch-news.mjs
      - name: Test data logic
        run: node --test tests/*.test.mjs
      - name: Commit changed news snapshot
        run: |
          if git diff --quiet -- data/news.json; then
            echo "News snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "data: refresh news snapshot"
          git push
