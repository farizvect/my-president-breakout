name: Refresh market snapshot

on:
  workflow_dispatch:
  schedule:
    # Once per hour during IDX market hours (09:00–16:00 WIB, weekdays).
    # GitHub cron uses UTC and is best-effort (can drift a few minutes).
    # Yahoo remains a delayed, non-licensed market feed.
    - cron: "0 2-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: Fetch delayed market data and headlines
        run: node scripts/fetch-data.mjs
      - name: Test data logic
        run: node --test tests/*.test.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: refresh IHSG market snapshot"
          git push
