name: Refresh market snapshot

on:
  workflow_dispatch:
  schedule:
    # Every five minutes during IDX market hours (09:00–16:15 WIB, weekdays).
    # GitHub cron uses UTC; Yahoo remains a delayed, non-licensed market feed.
    - cron: "*/5 2-8 * * 1-5"
    - cron: "0-15/5 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"
      - name: Test data logic
        run: node --test tests/*.test.mjs
      - name: Fetch delayed market data and headlines
        run: node scripts/fetch-data.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: refresh IHSG market snapshot"
          git push
